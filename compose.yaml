services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hirelens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "55433:5432"
    volumes:
      - hirelens-postgres-data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hirelens"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hirelens-ai-backend:${APP_VERSION:-0.0.1}
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/hirelens
      DATABASE_SSL: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000,https://jobcheck.excsi.dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hirelens-postgres-data:
