<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HireLens AI Tester</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="toolbar">
        <div>
          <h1>HireLens AI</h1>
          <p>Resume -> Job Gap Analyzer</p>
        </div>
        <div class="status-pill" id="healthStatus">Checking API...</div>
      </section>

      <section class="workspace">
        <form id="analysisForm" class="panel">
          <div class="panel-header">
            <h2>Job Scanner</h2>
            <button type="button" id="refreshButton" class="secondary">Refresh</button>
          </div>

          <label>
            Resume
            <input id="resume" name="resume" type="file" accept=".pdf,.docx,.txt" required />
          </label>

          <div class="split">
            <label>
              Job Title
              <input id="jobTitle" name="jobTitle" type="text" placeholder="Backend Developer" />
            </label>
            <label>
              Company
              <input id="company" name="company" type="text" placeholder="Example Company" />
            </label>
          </div>

          <label>
            Job Description
            <textarea
              id="jobDescription"
              name="jobDescription"
              rows="10"
              placeholder="Paste the job description here..."
              required
            ></textarea>
          </label>

          <button type="submit" id="submitButton">Run Analysis</button>
        </form>

        <section class="panel result-panel">
          <div class="panel-header">
            <h2>Result</h2>
            <span id="requestStatus" class="muted">Idle</span>
          </div>

          <div class="grade-card">
            <span>Fit Grade</span>
            <strong id="fitGrade">--</strong>
            <small id="fitLevel">0 to 100</small>
          </div>

          <div id="summary" class="summary empty">No analysis yet.</div>
          <pre id="resultJson">{}</pre>
        </section>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Recent Analyses</h2>
          <span class="muted">GET /api/analyses</span>
        </div>
        <div id="analysesList" class="analyses-list"></div>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
